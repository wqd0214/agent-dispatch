<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谁在给谁干活 · 原型</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#fff; --panel2:#f7f8fa; --line:#e2e5ea; --line2:#edeff3;
  --text:#1b2230; --muted:#687386; --faint:#9aa3b2;
  --accent:#2f6fde; --accent-bg:#e8effd;
  --run:#6a4fd3; --run-bg:#eeeafc; --wait:#b9700a; --wait-bg:#fdf2dd; --ok:#1b8a57; --ok-bg:#e2f4ea;
  --bad:#c8372f; --bad-bg:#fbe8e6; --mute-bg:#ebedf1; --shadow:0 10px 34px rgba(20,30,50,.18);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13161b; --panel:#1b1f26; --panel2:#20252d; --line:#2c323c; --line2:#252a33;
  --text:#e5e9f0; --muted:#9aa4b4; --faint:#6b7585;
  --accent:#5c94f6; --accent-bg:#1e2b45;
  --run:#a590f7; --run-bg:#2a2446; --wait:#e4a53e; --wait-bg:#3a2d13; --ok:#4fc48c; --ok-bg:#173326;
  --bad:#f1766e; --bad-bg:#3d1f1d; --mute-bg:#2a2f38; --shadow:0 10px 34px rgba(0,0,0,.55);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:3px 12px;display:flex;gap:7px;align-items:center}
.tab.on{background:var(--accent-bg);border-color:var(--accent);font-weight:600}
.tab small{color:var(--muted);font-weight:400}
.top .at{margin-left:auto;color:var(--faint);font-size:12px}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:318px 1fr}
.left{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px}
.left h6{margin:6px 6px 8px;font-size:12px;color:var(--muted);font-weight:600}
.sess{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.sess:hover{border-color:var(--faint)}
.sess.on{border-color:var(--accent);background:var(--accent-bg)}
.sess .h{display:flex;align-items:center;gap:8px}
.sess .h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .m{color:var(--muted);font-size:12px;margin:2px 0 6px}
.sess .c{display:flex;gap:10px;font-size:12px;margin-top:6px;flex-wrap:wrap}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--mute-bg)}
.seg i{display:block}
.k-run{color:var(--run)} .k-wait{color:var(--wait)} .k-ok{color:var(--ok)} .k-bad{color:var(--bad)}
.b-run{background:var(--run)} .b-wait{background:var(--wait)} .b-ok{background:var(--ok)} .b-bad{background:var(--bad)}
.right{overflow:auto;padding:16px 20px 60px}
/* 人 */
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;position:relative}
.av.sm{width:22px;height:22px;font-size:11px}
.av.boss{background:var(--text);color:var(--panel);width:46px;height:46px;font-size:17px}
.av.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--run);border-top-color:transparent;animation:spin 1.1s linear infinite}
.av.boss.live::after{border-color:var(--accent);border-top-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--run);flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(106,79,211,.55)}50%{box-shadow:0 0 0 6px rgba(106,79,211,0)}}
.boss-card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.boss-card h2{margin:0;font-size:16px}
.boss-card .say{margin-top:2px;font-size:14px}
.boss-card .say b{font-size:17px}
.boss-card .sub{color:var(--muted);font-size:12px}
.hint{background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:7px 11px;margin-top:10px;font-size:12.5px}
/* 三条道 */
.lanes{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-top:14px;align-items:start}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.lane>header{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px}
.lane>header b{font-size:14px}
.lane>header span{margin-left:auto;font-size:20px;font-weight:700}
.lane .who{font-size:12px;color:var(--muted);padding:0 4px 8px;border-bottom:1px dashed var(--line);margin-bottom:9px}
.lane.run{border-top:3px solid var(--run)} .lane.wait{border-top:3px solid var(--wait)} .lane.done{border-top:3px solid var(--ok)}
.p{display:flex;gap:10px;padding:9px;border:1px solid var(--line2);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2);min-width:0}
.p:hover{border-color:var(--accent)}
.p .bd{min-width:0;flex:1}
.p .nm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.p .nm b{font-size:13px}
.p .job{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .tk{font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p .now{font:11.5px var(--mono);color:var(--run);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip{height:4px;border-radius:2px;margin-top:6px;background:repeating-linear-gradient(-45deg,var(--run) 0 6px,var(--run-bg) 6px 12px);background-size:200% 100%;animation:move 1.2s linear infinite}
@keyframes move{to{background-position:-17px 0}}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:11.5px;line-height:18px;font-weight:600;background:var(--mute-bg);color:var(--muted);white-space:nowrap}
.tag.run{background:var(--run-bg);color:var(--run)} .tag.wait{background:var(--wait-bg);color:var(--wait)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.mini{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:7px;cursor:pointer;min-width:0}
.mini:hover{background:var(--panel2)}
.mini .job{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.more{border:0;background:none;color:var(--accent);padding:6px}
.empty{color:var(--faint);padding:14px 6px;text-align:center}
/* 执行图 */
.gantt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.gantt h3{margin:0 0 2px;font-size:14px}
.gantt .lg{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:10px;align-items:center}
.gantt .lg i{display:inline-block;width:18px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}
.grow{display:grid;grid-template-columns:230px 1fr;align-items:center;height:26px;cursor:pointer}
.grow:hover{background:var(--panel2)}
.grow .lb{display:flex;gap:7px;align-items:center;min-width:0;padding-right:10px}
.grow .lb span{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:26px;border-left:1px solid var(--line)}
.track .w{position:absolute;top:12px;height:2px;background:var(--wait);opacity:.55}
.track .t{position:absolute;top:7px;height:12px;border-radius:3px;min-width:3px}
.track .t.live{background:repeating-linear-gradient(-45deg,var(--run) 0 6px,var(--run-bg) 6px 12px);background-size:200% 100%;animation:move 1.2s linear infinite}
.track .d{position:absolute;top:4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;font-size:10px;line-height:16px;text-align:center;background:var(--panel);border:1px solid var(--line);z-index:1}
.axis{position:relative;height:20px;margin-left:230px;border-left:1px solid var(--line);color:var(--faint);font-size:11px}
.axis span{position:absolute;top:3px;white-space:nowrap}
.axis .brk{top:0;bottom:-2000px;border-left:1px dashed var(--line);height:auto}
/* 抽屉：两个人的往来 */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:760px;max-width:96vw;background:var(--panel);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.drawer header h3{margin:0;font-size:15px}
.drawer header .x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--muted)}
.drawer .body{overflow:auto;padding:16px 18px 40px}
.pair{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px;color:var(--muted)}
.pair .arrow{flex:1;max-width:120px;height:2px;background:var(--line);position:relative}
.msg{display:flex;gap:9px;margin-bottom:12px;max-width:92%}
.msg.r{margin-left:auto;flex-direction:row-reverse}
.msg .bub{border-radius:11px;padding:8px 11px;background:var(--panel2);border:1px solid var(--line2);min-width:0}
.msg.r .bub{background:var(--accent-bg);border-color:transparent}
.msg.you .bub{background:var(--wait-bg);border-color:transparent}
.msg .hd{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .tx{white-space:pre-wrap;word-break:break-word}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px;flex:none}
.dtabs a{padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs a.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.dtabs label{margin-left:auto;align-self:center;color:var(--muted);font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer}
.round{margin:16px 0 10px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.round::before,.round::after{content:"";flex:1;height:1px;background:var(--line)}
details.ask{background:var(--accent-bg);border-radius:10px;padding:8px 11px;margin:0 0 12px 40px}
details.ask summary{cursor:pointer;font-size:12px;color:var(--muted)}
details.ask pre,details.tool pre{white-space:pre-wrap;word-break:break-word;font:12px/1.6 var(--mono);margin:8px 0 0;max-height:320px;overflow:auto}
details.tool{margin:0 0 3px 31px;font:12px/1.6 var(--mono);border-left:2px solid var(--line);padding:1px 0 1px 9px;color:var(--muted)}
details.tool summary{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;list-style:none}
details.tool summary b{color:var(--run);font-weight:600}
details.tool.err summary b{color:var(--bad)}
details.tool[open] summary{white-space:normal}
.say{display:flex;gap:9px;margin:10px 0}
.say .bub{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:8px 11px;white-space:pre-wrap;word-break:break-word;min-width:0}
.say .when{font-size:11px;color:var(--faint);margin-bottom:2px}
.errline{color:var(--bad);margin:4px 0 4px 31px;font-size:12px}
.sep{text-align:center;color:var(--faint);font-size:12px;margin:10px 0}
.foot{position:fixed;right:14px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:11.5px;color:var(--muted);z-index:5}
@media (max-width: 1080px){.lanes{grid-template-columns:1fr}.wrap{grid-template-columns:260px 1fr}}
</style>
</head>
<body>
<div class="top"><h1>谁在给谁干活</h1><div class="tabs" id="tabs"></div><span class="at" id="at"></span></div>
<div class="wrap"><div class="left" id="left"></div><div class="right" id="right"></div></div>
<div id="layer"></div>
<div class="foot">原型 · 数据是本机派工台账的只读快照</div>
<script>
const DATA = __DATA__;
const NOW = DATA.now, JOBS = DATA.jobs;
const S = {g:null, sk:null, more:false, open:null, dtab:'talk', quiet:false};
const SESS = {};
window.__sess = (name, data) => { SESS[name] = data; if(S.open===name) drawer(JOBS.find(j=>j.n===name)); };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 三种处境：球在执行者手里 / 球在派工者手里 / 了结 */
const lane = j => j.st==='running' ? (j.need?'wait':'run') : (['accepted','rejected','stopped'].includes(j.st) ? 'done' : 'wait');
const FINAL = {accepted:['已验收','ok'], rejected:['已驳回','bad'], stopped:['已叫停','']};
function stateTag(j){
  if(j.need && lane(j)==='wait') return '<span class="tag wait">等你决定</span>';
  if(j.st==='running') return '<span class="tag run">正在执行</span>';
  if(j.st==='done') return '<span class="tag wait">已交回，等处理</span>';
  if(j.st==='failed') return '<span class="tag bad">运行失败，等处理</span>';
  const f = FINAL[j.st]||[j.st,'']; return `<span class="tag ${f[1]}">${f[0]}</span>`;
}
const forced = j => j.dec.some(d=>(d.a||'').includes('force'));
const statusTag = s => s?`<span class="tag ${s==='PASS'||s==='DONE'?'ok':s==='FAIL'?'bad':'wait'}">${esc(s)}</span>`:'';
function dur(sec){ sec=Math.max(0,Math.round(sec)); if(sec<60) return sec+' 秒'; const m=Math.floor(sec/60); if(m<60) return m+' 分'; const h=Math.floor(m/60); return h<24? h+' 时 '+(m%60)+' 分' : Math.floor(h/24)+' 天 '+(h%24)+' 时'; }
const hm = t => { const d=new Date(t*1000); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const md = t => { const d=new Date(t*1000); return (d.getMonth()+1)+'-'+String(d.getDate()).padStart(2,'0'); };
const ago = t => NOW-t<90 ? '刚刚' : dur(NOW-t)+'前';
const endOf = j => Math.max(j.c, ...j.turns.map(t=>t.e||0), ...j.dec.map(d=>d.t||0));
const lastTouch = j => j.st==='running' ? NOW : endOf(j);
/* 执行者头像：按岗位取一个字和一种颜色 */
function avatar(j, cls=''){
  const r = j.role, ch = /后端/.test(r)?'后':/前端/.test(r)?'前':/测试/.test(r)?'测':/复核/.test(r)?'审':/发版/.test(r)?'发':/未指定/.test(r)?'工':r.replace(/[a-zA-Z\- ]/g,'')[0]||r[0];
  let h=0; for(const c of r) h=(h*31+c.charCodeAt(0))%360;
  return `<div class="av ${cls} ${j.st==='running'&&!cls.includes('sm')?'live':''}" style="background:hsl(${h} 46% 46%)" title="${esc(r)}">${ch}</div>`;
}

/* ---------- 分组：项目 → 派工者的一次会话 ---------- */
function sessions(g){
  const m = new Map();
  JOBS.filter(j=>j.g===g).forEach(j=>{ if(!m.has(j.sk)) m.set(j.sk,{sk:j.sk, jobs:[], kind:j.skind, title:j.stitle}); const s=m.get(j.sk); s.jobs.push(j); if(j.stitle) s.title=j.stitle; });
  const list = [...m.values()].map(s=>{
    const c = {run:0,wait:0,done:0}; s.jobs.forEach(j=>c[lane(j)]++);
    return Object.assign(s,{c, registered:!s.sk.startsWith('batch:'), name:s.title||[...new Set(s.jobs.map(j=>j.batch))][0],
      first:Math.min(...s.jobs.map(j=>j.c)), last:Math.max(...s.jobs.map(lastTouch))});
  });
  return list.sort((a,b)=>(b.c.run>0)-(a.c.run>0) || (b.c.wait>0)-(a.c.wait>0) || b.last-a.last);
}
function renderTabs(){
  const gs = [...new Set(JOBS.map(j=>j.g))].map(g=>({g, run:JOBS.filter(j=>j.g===g&&lane(j)==='run').length, n:JOBS.filter(j=>j.g===g).length, last:Math.max(...JOBS.filter(j=>j.g===g).map(lastTouch))}))
    .sort((a,b)=>b.run-a.run||b.last-a.last);
  if(!S.g) S.g = gs[0].g;
  $('#tabs').innerHTML = gs.map(x=>`<button class="tab ${x.g===S.g?'on':''}" data-g="${esc(x.g)}">${x.run?'<i class="pulse"></i>':''}${esc(x.g)}<small>${x.run?x.run+' 张在跑 · ':''}共 ${x.n}</small></button>`).join('');
  $('#at').textContent = '快照时间 ' + DATA.at;
}
function renderLeft(list){
  $('#left').innerHTML = `<h6>${esc(S.g)} · ${list.length} 个派工者会话</h6>` + list.map(s=>{
    const n = s.jobs.length;
    return `<div class="sess ${s.sk===S.sk?'on':''}" data-sk="${esc(s.sk)}">
      <div class="h">${s.c.run?'<i class="pulse"></i>':''}<b>${esc(s.name)}</b></div>
      <div class="m">${s.registered?esc(s.kind||'主管'):'派工者未登记 · 暂按批次归组'} · ${md(s.first)} ${hm(s.first)} 起 · ${s.c.run?'进行中':'最后活动 '+ago(s.last)}</div>
      <div class="seg"><i class="b-run" style="width:${s.c.run/n*100}%"></i><i class="b-wait" style="width:${s.c.wait/n*100}%"></i><i class="b-ok" style="width:${s.c.done/n*100}%"></i></div>
      <div class="c"><span>派出 <b>${n}</b></span><span class="k-run">执行中 <b>${s.c.run}</b></span>${s.c.wait?`<span class="k-wait">等处理 <b>${s.c.wait}</b></span>`:''}<span class="k-ok">已完成 <b>${s.c.done}</b></span></div></div>`;
  }).join('');
}

/* ---------- 一次会话：派工者和它派出去的人 ---------- */
function person(j){
  const redo = j.turn>1 ? `<span class="tag wait">第 ${j.turn} 轮 · 返工 ${j.turn-1} 次</span>` : '';
  const t0 = (j.turns[j.turns.length-1]||{}).s || j.c;
  const line = j.st==='running'
    ? `<div class="now">${esc(j.last||'执行中…')}</div><div class="strip"></div>`
    : `<div class="tk" style="color:var(--muted)">${esc(j.q||j.sum||'')}</div>`;
  return `<div class="p" data-job="${esc(j.n)}">${avatar(j)}<div class="bd">
    <div class="nm"><b>${esc(j.role)}</b>${j.st==='running'?`<span class="tag run">已跑 ${dur(NOW-t0)}</span>`:stateTag(j)}${statusTag(j.status)}${redo}</div>
    <div class="job">${esc(j.n)} · ${esc(j.model)}</div>
    <div class="tk">${esc(j.task)}</div>${line}</div></div>`;
}
function mini(j){
  return `<div class="mini" data-job="${esc(j.n)}">${avatar(j,'sm')}<span class="job">${esc(j.n)}</span>${statusTag(j.status)}${j.turn>2?`<span class="tag wait">返工 ${j.turn-1} 次</span>`:''}${forced(j)?'<span class="tag bad">强制验收</span>':''}${j.st!=='accepted'?stateTag(j):''}</div>`;
}
function scale(js){
  const iv = js.map(j=>[j.c, j.st==='running'?NOW:Math.max(endOf(j), j.c+60)]).sort((a,b)=>a[0]-b[0]), mg=[];
  iv.forEach(([a,b])=>{ const l=mg[mg.length-1]; if(l && a<=l[1]+1500) l[1]=Math.max(l[1],b); else mg.push([a,b]); });
  const GAP=2.2, busy=mg.reduce((s,[a,b])=>s+b-a,0), k=(100-GAP*(mg.length-1))/Math.max(busy,60);
  const x = t => { let p=0; for(const [a,b] of mg){ if(t<=a) return p; if(t<=b) return p+(t-a)*k; p+=(b-a)*k+GAP; } return 100; };
  return {x, mg};
}
const DEC = {accept:['✓','验收','ok'], 'accept(force)':['✓','强制验收','bad'], reply:['↩','打回返工','wait'], reject:['✕','驳回','bad'], stop:['■','叫停',''], escalate:['!','上报给你','wait'], follow:['→','重新跟进','']};
function gantt(js){
  const {x, mg} = scale(js);
  const rows = js.map(j=>{
    let h=''; const segs=j.turns.filter(t=>t.s);
    const tail = j.st==='running'?NOW:endOf(j);
    if(segs.length) h += `<i class="w" style="left:${x(segs[0].s)}%;width:${Math.max(0,x(tail)-x(segs[0].s))}%"></i>`;
    segs.forEach((t,i)=>{ const live = !t.e && j.st==='running', e=t.e||NOW, bad=t.st==='failed';
      h += `<i class="t ${live?'live':''}" style="left:${x(t.s)}%;width:${Math.max(.35,x(e)-x(t.s))}%;${live?'':`background:var(--${bad?'bad':'run'})`}" title="第 ${i+1} 轮 ${hm(t.s)}–${t.e?hm(t.e):'现在'}（${dur(e-t.s)}）${t.status?' '+t.status:''}"></i>`; });
    j.dec.filter(d=>d.t).forEach(d=>{ const m=DEC[d.a]||['·',d.a,'']; h += `<i class="d k-${m[2]||'x'}" style="left:${x(d.t)}%" title="${hm(d.t)} 派工者：${m[1]}">${m[0]}</i>`; });
    return `<div class="grow" data-job="${esc(j.n)}"><div class="lb">${avatar(j,'sm')}<span>${esc(j.n)}</span></div><div class="track">${h}</div></div>`;
  }).join('');
  const axis = mg.map(([a,b],i)=>`${i?`<i class="axis brk" style="position:absolute;left:${x(a)-1.1}%"></i>`:''}<span style="left:${x(a)+.3}%">${md(a)} ${hm(a)}</span>`).join('')
    + `<span style="right:0">${js.some(j=>j.st==='running')?'现在':hm(mg[mg.length-1][1])}</span>`;
  return `<div class="gantt"><h3>执行图</h3>
    <div class="lg"><span><i style="background:var(--run)"></i>执行者在干活</span><span><i style="background:var(--wait);height:2px;opacity:.6"></i>交回后在等派工者</span>
      <span><i style="background:var(--bad)"></i>这一轮失败</span><span>圆点 = 派工者的动作：✓ 验收　↩ 打回返工　✕ 驳回　! 上报给你</span><span>虚线 = 中间空闲的时段已折叠</span></div>
    <div class="axis">${axis}</div>${rows}</div>`;
}
function renderRight(s){
  const by = {run:[],wait:[],done:[]}; s.jobs.forEach(j=>by[lane(j)].push(j));
  by.run.sort((a,b)=>a.c-b.c); by.wait.sort((a,b)=>(b.need-a.need)||b.c-a.c); by.done.sort((a,b)=>endOf(b)-endOf(a));
  const you = by.wait.filter(j=>j.need).length, heavy = s.jobs.filter(j=>j.turn>=3).length, fc = s.jobs.filter(forced).length;
  const people = [...new Set(s.jobs.map(j=>j.role))];
  const doneShown = S.more ? by.done : by.done.slice(0,10);
  $('#right').innerHTML = `
    <div class="boss-card"><div class="av boss ${by.run.length?'live':''}">主</div><div style="min-width:0">
      <div class="sub">${s.registered?esc(s.kind||'主管')+' · 会话 '+esc(s.sk.slice(0,8)):'派工者（历史单子没有记录是谁派的，这里暂按批次当作一次会话）'}</div>
      <h2>${esc(s.name)}</h2>
      <div class="say">派出了 <b>${s.jobs.length}</b> 张单，交给 ${people.length} 类执行者：
        <b class="k-run">${by.run.length}</b> 张正在执行，<b class="k-wait">${by.wait.length}</b> 张交回来等处理，<b class="k-ok">${by.done.length}</b> 张已完成</div></div></div>
    ${you?`<div class="hint">有 ${you} 张单在等<b>你</b>决定，派工者自己定不了。</div>`:''}
    ${heavy||fc?`<div class="hint" style="background:var(--mute-bg);color:var(--muted)">值得留意：${heavy?`${heavy} 张返工到第 3 轮以上`:''}${heavy&&fc?'；':''}${fc?`${fc} 张是强制验收（没过闸门就收了）`:''}</div>`:''}
    <div class="lanes">
      <div class="lane run"><header><b>正在执行</b><span class="k-run">${by.run.length}</span></header><div class="who">派工者 → 执行者：活已经派出去，执行者在干</div>
        ${by.run.map(person).join('')||'<div class="empty">现在没有人在干活</div>'}</div>
      <div class="lane wait"><header><b>交回来了，等处理</b><span class="k-wait">${by.wait.length}</span></header><div class="who">执行者 → 派工者：活交回来了（或做不下去了），等派工者看</div>
        ${by.wait.map(person).join('')||'<div class="empty">没有积压</div>'}</div>
      <div class="lane done"><header><b>已完成</b><span class="k-ok">${by.done.length}</span></header><div class="who">派工者已经给了结论：验收、驳回或叫停</div>
        ${doneShown.map(mini).join('')||'<div class="empty">还没有完成的单子</div>'}
        ${by.done.length>10?`<button class="more" data-more="1">${S.more?'收起':`展开其余 ${by.done.length-10} 张`}</button>`:''}</div>
    </div>${gantt(s.jobs)}`;
}
/* ---------- 一张单：两个人之间的往来 ---------- */
function drawer(j){
  const ev = [{t:j.c, who:'boss', hd:'派工', tx:j.task}];
  j.turns.forEach((t,i)=>{ if(t.e) ev.push({t:t.e, who:'worker', hd:`第 ${i+1} 轮交回（干了 ${dur(t.e-t.s)}）`, tag:t.status||(t.st==='failed'?'失败':''), tx: t.st==='failed'?(t.why||'运行失败'):(i===j.turns.length-1?(j.sum||''):'') }); });
  j.dec.forEach(d=>{ const m=DEC[d.a]||['',d.a,'']; ev.push({t:d.t||0, who:d.a==='escalate'?'you':'boss', hd:m[1], cls:m[2], tx:d.note}); });
  ev.sort((a,b)=>a.t-b.t);
  const boss = '<div class="av sm" style="background:var(--text);color:var(--panel)">主</div>';
  const msgs = ev.map(e=>`<div class="msg ${e.who==='worker'?'':'r'} ${e.who==='you'?'you':''}">${e.who==='worker'?avatar(j,'sm'):boss}
    <div class="bub"><div class="hd">${e.t?md(e.t)+' '+hm(e.t):''} · ${e.who==='worker'?'执行者 → 派工者':e.who==='you'?'派工者 → 你':'派工者 → 执行者'} · <b>${esc(e.hd)}</b>${e.tag?statusTag(e.tag):''}</div>
    ${e.tx?`<div class="tx">${esc(e.tx)}</div>`:''}</div></div>`).join('');
  const talk = `<div class="pair"><div class="av sm" style="background:var(--text);color:var(--panel)">主</div><span>派工者</span><i class="arrow"></i><span>${j.turn} 轮往来</span><i class="arrow"></i><span>${esc(j.role)}</span>${avatar(j,'sm')}</div>
    ${msgs}${j.st==='running'?`<div class="sep">执行者正在干活：${esc(j.last||'…')}</div>`:''}`;
  $('#layer').innerHTML = `<div class="mask" data-close="1"></div><div class="drawer"><header>${avatar(j)}<div style="min-width:0"><h3>${esc(j.role)}</h3>
      <div style="color:var(--muted);font-size:12px;font-family:var(--mono)">${esc(j.n)} · ${esc(j.model)} · ${esc(j.repo)}</div></div>${stateTag(j)}<button class="x" data-close="1">×</button></header>
    <div class="dtabs"><a class="${S.dtab==='talk'?'on':''}" data-dtab="talk">和派工者的往来</a><a class="${S.dtab==='sess'?'on':''}" data-dtab="sess">执行者的会话内容</a>
      ${S.dtab==='sess'?`<label><input type="checkbox" data-quiet="1" ${S.quiet?'checked':''}>只看它说的话</label>`:''}</div>
    <div class="body" id="dbody">${S.dtab==='talk'?talk:sessionView(j)}</div></div>`;
  if(S.dtab==='sess' && j.st==='running'){ const b=$('#dbody'); b.scrollTop=b.scrollHeight; }
}
/* 执行者自己的会话：每轮收到的交代、它说的话、它调的工具 */
function sessionView(j){
  const d = SESS[j.n];
  if(!d){ const sc=document.createElement('script'); sc.src='team-data/'+encodeURIComponent(j.n)+'.js'; sc.onerror=()=>{ $('#dbody').innerHTML='<div class="empty">这张单没有留下会话内容</div>'; }; document.head.appendChild(sc);
    return '<div class="empty">正在读取会话内容…</div>'; }
  if(!d.ev.length) return '<div class="empty">这张单没有留下会话内容</div>';
  let h = d.omitted?`<div class="sep">前面还有 ${d.omitted} 条较早的记录没有带进预览</div>`:'', round=0, tools=0;
  d.ev.forEach(e=>{
    if(e.r!==round){ round=e.r; h += `<div class="round">第 ${round} 轮</div>` + (d.asks[round]?`<details class="ask"><summary>派工者这一轮交代的内容（点开看原文）</summary><pre>${esc(d.asks[round])}</pre></details>`:''); }
    if(e.k==='x') h += `<div class="say">${avatar(j,'sm')}<div style="min-width:0"><div class="when">${esc(e.t)}</div><div class="bub">${esc(e.x)}</div></div></div>`;
    else if(e.k==='e') h += `<div class="errline">${esc(e.t)} 出错：${esc(e.x)}</div>`;
    else if(!S.quiet){ tools++; h += `<details class="tool ${e.e?'err':''}"><summary><b>${esc(e.n)}</b> ${esc(e.i)}${e.ms>=1000?` · ${dur(e.ms/1000)}`:''}${e.e?' · 失败':''}</summary><pre>${esc(e.o||'（没有输出）')}</pre></details>`; }
  });
  return h + (j.st==='running'?'<div class="sep">还在继续…（这是快照，重新生成后能看到后面的内容）</div>':'');
}
function render(){
  renderTabs(); const list = sessions(S.g);
  if(!list.some(s=>s.sk===S.sk)) S.sk = list[0].sk;
  renderLeft(list); renderRight(list.find(s=>s.sk===S.sk));
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-g],[data-sk],[data-job],[data-more],[data-close],[data-dtab]'); if(!t) return;
  if(t.dataset.close){ $('#layer').innerHTML=''; S.open=null; return; }
  if(t.dataset.dtab){ S.dtab=t.dataset.dtab; return drawer(JOBS.find(j=>j.n===S.open)); }
  if(t.dataset.g){ S.g=t.dataset.g; S.sk=null; S.more=false; return render(); }
  if(t.dataset.sk){ S.sk=t.dataset.sk; S.more=false; render(); $('#right').scrollTop=0; return; }
  if(t.dataset.more){ S.more=!S.more; return render(); }
  if(t.dataset.job){ const j=JOBS.find(x=>x.n===t.dataset.job); S.open=j.n; S.dtab = j.st==='running'?'sess':'talk'; return drawer(j); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ $('#layer').innerHTML=''; S.open=null; } });
document.addEventListener('change', e=>{ if(e.target.dataset.quiet){ S.quiet=e.target.checked; drawer(JOBS.find(j=>j.n===S.open)); } });
render();
/* 可以用 #job=<作业名>&tab=sess 直接打开某张单的会话内容 */
{ const h=new URLSearchParams(location.hash.slice(1)), j=JOBS.find(x=>x.n===h.get('job'));
  if(j){ S.g=j.g; S.sk=j.sk; render(); S.open=j.n; S.dtab=h.get('tab')||'sess'; drawer(j); } }
</script>
</body>
