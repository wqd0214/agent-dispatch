<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f8f9fb; --line:#e3e6eb; --line2:#eef0f3;
  --text:#1c2330; --muted:#6a7485; --faint:#98a1b0;
  --accent:#2f6fde; --accent-bg:#e9f0fd; --accent-text:#1d55b8;
  --ok:#1a8a55; --ok-bg:#e3f4eb; --warn:#b26a00; --warn-bg:#fdf1dc; --bad:#c7362f; --bad-bg:#fbe8e6;
  --run:#6b4fd0; --run-bg:#eeeafb; --mute-bg:#eceef2;
  --shadow:0 8px 30px rgba(20,30,50,.16); --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --panel2:#20252d; --line:#2c323c; --line2:#262b34;
  --text:#e4e8ef; --muted:#9aa4b4; --faint:#6c7686;
  --accent:#5b93f5; --accent-bg:#1f2c45; --accent-text:#9cc0ff;
  --ok:#4cc38a; --ok-bg:#173326; --warn:#e2a23b; --warn-bg:#3a2c12; --bad:#f0736b; --bad-bg:#3d1f1d;
  --run:#a18cf5; --run-bg:#2a2445; --mute-bg:#2a2f38; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:216px 1fr;height:100vh}
/* 侧栏 */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.proj{margin:12px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);position:relative;cursor:pointer}
.proj b{display:block;font-size:13.5px}
.proj small{color:var(--muted)}
.proj .caret{position:absolute;right:10px;top:12px;color:var(--faint)}
.projmenu{position:absolute;left:12px;top:64px;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;padding:4px}
.projmenu div{padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;cursor:pointer}
.projmenu div:hover{background:var(--panel2)}
.nav{flex:1;overflow:auto;padding:0 8px 12px}
.nav h6{margin:14px 8px 4px;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.nav a kbd{margin-left:auto}
.nav .hint{margin:4px 10px;color:var(--faint);font-size:12px}
.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px;font-weight:600}
.badge.soft{background:var(--mute-bg);color:var(--muted)}
kbd{font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel2)}
.sidefoot{border-top:1px solid var(--line);padding:9px 14px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
/* 主区 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:600}
.top .sub{color:var(--muted)}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--faint);background:var(--panel2);cursor:pointer;width:190px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:2px 8px;font-size:12px}
.link{color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.split{flex:1;min-height:0;display:grid;grid-template-columns:372px 1fr}
.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.pane{overflow:auto;padding:16px 20px 30px}
.page{flex:1;overflow:auto;padding:18px 22px 30px}
.grp{padding:9px 14px 5px;font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line2);z-index:2;display:flex;gap:6px}
.item{padding:9px 14px;border-bottom:1px solid var(--line2);cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--panel2)}
.item.on{background:var(--accent-bg);border-left-color:var(--accent)}
.item .r1{display:flex;align-items:center;gap:8px}
.item .r1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r1 .tag{margin-left:auto;flex:none}
.item .r2{color:var(--muted);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r3{margin-top:3px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:11.5px;line-height:19px;font-weight:600;background:var(--mute-bg);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.run{background:var(--run-bg);color:var(--run)}
.tag.acc{background:var(--accent-bg);color:var(--accent-text)}
.empty{padding:40px 20px;text-align:center;color:var(--faint)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:1px 10px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text);font-weight:600}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:5px 8px;outline:0}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical;line-height:1.55}
/* 详情 */
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh h2{margin:0;font-size:17px}
.meta{color:var(--muted);margin:3px 0 14px;font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:13px}
.card h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
.card.decide{border-color:var(--warn);background:linear-gradient(var(--warn-bg),var(--warn-bg)) top/100% 3px no-repeat,var(--panel)}
.card.fail{border-color:var(--bad)}
.q{background:var(--panel2);border-left:3px solid var(--warn);padding:8px 11px;border-radius:0 6px 6px 0;margin:0 0 10px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 12px}
.tabs a{padding:6px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent-text);border-color:var(--accent);font-weight:600}
.log{font:12px/1.7 var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;white-space:pre-wrap;word-break:break-all}
.log .t{color:var(--faint)} .log .k{display:inline-block;min-width:34px;font-weight:600}
.log .k.tool{color:var(--run)} .log .k.say{color:var(--accent)} .log .k.err{color:var(--bad)}
pre.doc{font:12px/1.65 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;white-space:pre-wrap;margin:0;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}

p.pd{margin:0 0 14px;color:var(--muted)}
.two{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.rolelist{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}

.cell{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--faint);background:transparent}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell.inh{border-color:var(--accent)}
.cell.off{border-style:dashed}
.cell.x{border-color:var(--bad);color:var(--bad)}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;margin:8px 2px 14px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:14px;height:14px;cursor:default;font-size:9px}
/* 批次 */
.flow{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px}
.step .rail{display:flex;flex-direction:column;align-items:center}
.step .rail b{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:var(--faint);flex:none}

.step .rail b.ok{background:var(--ok)} .step .rail b.bad{background:var(--bad)} .step .rail b.run{background:var(--run)} .step .rail b.warn{background:var(--warn)}
.step .card{cursor:pointer;margin-bottom:10px}
.step .card:hover{border-color:var(--accent)}

.mask{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--panel);border-radius:11px;box-shadow:var(--shadow);width:460px;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.dlg.wide{width:1040px}
.dlg header{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;display:flex;align-items:center}
.dlg .body{padding:15px 18px;overflow:auto}
.dlg footer{padding:11px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg footer .info{margin-right:auto;color:var(--muted);font-size:12px}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
label.f input[type=text],label.f select{width:100%}
.conseq{background:var(--panel2);border-radius:6px;padding:8px 10px;color:var(--muted);font-size:12px;margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rolecards{display:grid;gap:7px;margin-bottom:12px}
.rc{border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer}
.rc.on{border-color:var(--accent);background:var(--accent-bg)}
.rc small{color:var(--muted);display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2330;color:#fff;padding:8px 16px;border-radius:8px;z-index:80;box-shadow:var(--shadow);font-size:13px}
.note{margin-top:16px;border:1px dashed var(--line);border-radius:8px;padding:9px 12px;color:var(--muted);font-size:12px;background:var(--panel2)}
.note b{color:var(--text)}
.sw{width:32px;height:18px;border-radius:9px;background:var(--mute-bg);border:0;position:relative;vertical-align:middle;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)} .sw.on::after{left:16px}
.pal{width:560px} .pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 16px;font-size:15px;background:transparent}

</style>

function history(j){
  const base = [['工具','tool','read 派工单与相关文件'],['回复','say','已理解任务，开始执行'],['工具','tool','bash git status'],
    ['工具','tool', j.role==='tester'?'playwright-pallet.browser_navigate 登录页':'edit '+(j.evidence||'源文件').split(' · ').pop()],
    ['工具','tool', j.role==='tester'?'DB 只读查询：核对库存真值':'bash 运行测试 → 通过']];
  if(j.st==='running') base.push(['工具','tool',j.now]);
  else if(j.st==='failed') base.push(['错误','err',j.reason]);
  else base.push(['回复','say',`STATUS: ${j.status} ｜ ${j.summary||''}`]);
  return `<div class="log">${base.map((x,i)=>`<span class="t">[${String(18+Math.floor(i/3)).padStart(2,'0')}:${String(31+i*2).padStart(2,'0')}]</span> <span class="k ${x[1]}">${x[0]}</span> ${esc(x[2])}`).join('\n')}${j.st==='running'?'\n<span class="t">… 实时滚动中</span>':''}</div>`;
}

/* 生效范围计算：角色 → 项目 → 全局 */
function eff(kind, pid, col, id){
  const sc = SCOPE[kind], mx = sc.mx[pid]||{};
  const g = !!sc.glob[id], pv = (mx._p||{})[id], pOn = pv?pv==='on':g;

function openField(k,label,v){
  $('#layer').innerHTML = `<div class="mask" data-act="close"><div class="dlg"><header>${esc(label)} · 为本项目单独配置</header><div class="body">
    <div class="conseq">写到本项目这一层，不影响其它项目；随时可以「恢复继承」回到全局的值。</div>
    <label class="f"><span>${esc(label)}</span><input type="text" id="fv" value="${esc(v)}"></label></div>
    <footer><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="fsave" data-k="${k}">保存</button></footer></div></div>`;
  setTimeout(()=>$('#fv').select(),30);
}
const closeLayer = () => $('#layer').innerHTML='';

/* ================= 渲染与事件 ================= */
function render(){
  document.documentElement.dataset.theme = S.dark?'dark':'light';
  if(S.proj==='all' && S.route.startsWith('p-')) S.route='inbox';
  renderSide(); renderTop(); $('#view').innerHTML = V[S.route]();
}
function setJob(id, st, dec){ const j=JOBS.find(x=>x.id===id); j.st=st; if(dec) j.decisions.push(['刚刚','你',...dec]);
  if(st==='running'){j.turn++; j.now='收到续派内容，继续执行…'; j.dur='0 分'; j.status=null}
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el){ if(S.menu){S.menu=false;renderSide()} return; }
  const a = el.dataset.act, d = el.dataset;
  if(a==='close'){ if(e.target!==el && !el.matches('button')) return; if(d.toast) toast(d.toast); return closeLayer(); }
  if(a==='menu'){S.menu=!S.menu; return renderSide()}
  if(a==='proj'){S.proj=d.id; S.menu=false; S.sel=null; return render()}
  if(a==='newproj'){S.menu=false; renderSide(); return toast('原型：弹出新建项目表单（ID、显示名、工程目录）')}
  if(a==='go'){S.route=d.r; S.menu=false; return render()}
  if(a==='sel'){S.sel=d.id; S.tab='log'; return render()}
  if(a==='tab'){S.tab=d.k; return render()}
  if(a==='fst'){S.jf.st=d.v; return render()}
  if(a==='batch'){S.batch=d.id; return render()}
  if(a==='tobatch'){S.batch=d.id; S.route='batches'; return render()}
  if(a==='tojob'){const j=JOBS.find(x=>x.id===d.id); closeLayer(); if(S.proj!=='all'&&S.proj!==j.p) S.proj=j.p; S.route='jobs'; S.jf={st:'',role:'',q:''}; S.sel=d.id; return render()}
  if(a==='stat'){S.stat=d.k; return render()}
  if(a==='role'){S.role=d.id; return render()}
  if(a==='rtab'){S.rtab=d.k; return render()}
  if(a==='theme'){S.dark=!S.dark; return render()}
  if(a==='settheme'){S.dark=d.v==='dark'; return render()}
  if(a==='notes'){S.notes=!S.notes; return render()}
  if(a==='tip') return toast(d.msg);
  if(a==='swtoggle') return el.classList.toggle('on');
  if(a==='pref'){S.prefs[d.k]=!S.prefs[d.k]; return render()}
  if(a==='dispatch') return openDispatch();
  if(a==='palette') return openPalette();
  if(a==='import') return openImport();
  if(a==='dlg') return openDlg(d.kind, d.id);
  if(a==='dlgok'){ const k=d.kind, v=$('#dv').value.trim(), c=DLG[k];
    if(c.req && !v){ $('#dv').style.borderColor='var(--bad)'; return toast('这一项必填'); }
    setJob(d.id, c.to, [c.t, v||'—']);
    if(k==='redo'){ const o=JOBS.find(x=>x.id===d.id); JOBS.unshift(J({...o,id:v,st:'running',status:null,now:'刚派出，正在读派工单',dur:'0 分',ago:'刚刚',decisions:[],reason:null})); S.sel=v; }
    closeLayer(); render(); return toast(k==='redo'?`已派出 ${v}`:`${d.id} 已${c.t}`); }
  if(a==='answer'){ const v=$('#ans').value.trim(); if(!v){$('#ans').style.borderColor='var(--bad)';return toast('先写答复')} setJob(d.id,'running',['答复并续派',v]); render(); return toast('答复已发给执行者，作业继续运行'); }
  if(a==='markdone'){ setJob(d.id,'review',['标记已处理','—']); render(); return toast('已标记为已处理，作业转入待审查'); }
  if(a==='gate'){ JOBS.find(x=>x.id===d.id).gate='pass'; render(); return toast('闸门通过：进程正常结束、结论含 STATUS'); }
  if(a==='cell'){ if(d.col==='_g') return toast('全局默认在「全局 → MCP 与技能登记」里改');
    const mx=SCOPE[d.kind].mx[S.proj]=SCOPE[d.kind].mx[S.proj]||{}, c=mx[d.col]=mx[d.col]||{}, cur=c[d.id];
    if(!cur) c[d.id]='on'; else if(cur==='on') c[d.id]='off'; else delete c[d.id]; return render(); }
  if(a==='fedit') return openField(d.k, d.label, d.v);
  if(a==='fsave'){ S.over[S.proj+'/'+S.role+'/'+d.k]=$('#fv').value; closeLayer(); render(); return toast('已保存到本项目这一层'); }
  if(a==='freset'){ S.over[S.proj+'/'+S.role+'/'+d.k]=null; render(); return toast('已恢复继承全局的值'); }
  if(a==='bsave'){ S.briefs[S.proj+'/'+S.role]=$('#brief').value; render(); return toast('岗位说明书已保存'); }
  if(a==='breset'){ delete S.briefs[S.proj+'/'+S.role]; render(); return toast('已恢复继承全局的岗位说明书'); }
  if(a==='bvar'){ const t=$('#brief'), s=t.selectionStart; t.value=t.value.slice(0,s)+'{{'+d.v+'}}'+t.value.slice(t.selectionEnd); t.focus(); t.dispatchEvent(new Event('input',{bubbles:true})); return; }
  if(a==='drole'){ D.task=$('#dtask').value; D.name=$('#dname').value; D.role=d.id; return drawDispatch(); }
  if(a==='dgo'){ const task=$('#dtask').value.trim(); if(!task){$('#dtask').style.borderColor='var(--bad)';return toast('先写任务')}
    const p=PROJECTS.find(x=>x.id===D.p), r=ROLES[D.role], name=$('#dname').value.trim()||`${D.role}-1004-1830`;
    JOBS.unshift(J({id:name,p:D.p,repo:(p.repos.find(x=>r.repos.split(' / ').includes(x.id))||p.repos[0]).name,role:D.role,batch:D.batch||'adhoc',model:r.pool[0][0],st:'running',status:null,dur:'0 分',ago:'刚刚',mode:r.mode,task,now:'刚派出，正在读派工单'}));
    closeLayer(); S.proj=D.p; S.route='inbox'; S.sel=name; render(); return toast(`已派出 ${name}`); }
});
document.addEventListener('change', e => { const k=e.target.dataset.chg;
  if(k==='frole'){S.jf.role=e.target.value; render()}
  if(k==='dproj'){D.task=$('#dtask').value; D.p=e.target.value; D.role=PROJECTS.find(x=>x.id===D.p).defRole; drawDispatch()}
});
document.addEventListener('input', e => {
  if(e.target.id==='dtask'||e.target.id==='dname'){ D.task=$('#dtask').value; D.name=$('#dname').value; $('#dprev').textContent=dPreview(); }
  if(e.target.id==='brief'){ const pv=$('#bprev'); pv.textContent=briefText(e.target.value, JSON.parse(pv.dataset.vars)); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape') return closeLayer();
  const mod = e.metaKey||e.ctrlKey; if(!mod) return;
  if(e.key==='k'){e.preventDefault(); openPalette()}
  if(e.key==='j'){e.preventDefault(); openDispatch()}
  const i='1234'.indexOf(e.key); if(i>=0 && e.key.length===1){e.preventDefault(); S.route=NAV[i][0]; render()}
});
render();
</script>
</body>
</html>
